machine:
  install:
    disk: /dev/sda
  kubelet:
    extraMounts:
      - destination: /var/local-path-provisioner
        type: bind
        source: /var/local-path-provisioner
        options: [bind, rshared, rw]
    nodeIP:
      validSubnets: [10.100.20.0/24]
cluster:
  etcd:
    advertisedSubnets: [10.100.20.0/24]