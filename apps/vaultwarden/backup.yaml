apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-backup-rclone
  namespace: vaultwarden
data:
  rclone.conf: |
    [nas]
    type = local
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 3 * * *"
  timeZone: Asia/Jerusalem
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: ttionya/vaultwarden-backup:1.27.2
              args: [backup]
              env:
                - { name: TZ, value: "Asia/Jerusalem" }
                - { name: DB_TYPE, value: postgresql }
                - { name: PG_HOST, value: vaultwarden-db-rw }
                - name: PG_PASSWORD
                  valueFrom: { secretKeyRef: { name: vaultwarden-db-app, key: password } }
                - name: ZIP_PASSWORD
                  valueFrom: { secretKeyRef: { name: vaultwarden-backup, key: ZIP_PASSWORD } }
                - { name: ZIP_TYPE, value: 7z }
                - { name: RCLONE_REMOTE_NAME, value: nas }
                - { name: RCLONE_REMOTE_DIR, value: /nas }
                - { name: BACKUP_KEEP_DAYS, value: "30" }
              volumeMounts:
                - { name: data, mountPath: /bitwarden/data, readOnly: true }
                - { name: nas, mountPath: /nas }
                - { name: rclone, mountPath: /config/rclone, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { memory: 512Mi }
          volumes:
            - name: data
              persistentVolumeClaim: { claimName: vaultwarden-data }
            - name: nas
              nfs: { server: 10.220.20.55, path: /vw-backups }
            - name: rclone
              configMap: { name: vaultwarden-backup-rclone }
