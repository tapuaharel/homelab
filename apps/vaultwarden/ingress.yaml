apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    tailscale.com/tags: "tag:password-manager"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service: { name: vaultwarden, port: { number: 80 } }
  tls:
    - hosts: [vault]